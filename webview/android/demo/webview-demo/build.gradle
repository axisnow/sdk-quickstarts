plugins {
    id 'com.android.application'
}

android {
    namespace 'com.axsecurity.sdk.webview.demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.axsecurity.sdk.webview.demo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Required explicitly: the AXWebView lib is consumed here as a local .aar (via fileTree),
    // which does not carry transitive deps. 1.4.0 matches the lib floor (1.4.0 fixes the
    // setProxyOverride fallback-rule bug that affects ProxyConfig.addDirect()).
    implementation 'androidx.webkit:webkit:1.4.0'
}
