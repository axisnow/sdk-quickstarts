plugins {
    id 'com.android.application'
}

android {
    namespace 'com.axsecurity.sdk.axhttp.okhttp.demo'
    compileSdk 35

    defaultConfig {
        applicationId "com.axsecurity.sdk.axhttp.okhttp.demo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Store .so uncompressed and 16 KB-aligned in the APK so Android 15+ can
    // mmap them directly. Some transitive deps may merge extractNativeLibs="true"
    // into the manifest; this build.gradle setting takes precedence.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

}