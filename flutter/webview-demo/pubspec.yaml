name: axsecurity_webview_demo
description: >-
  Minimal flutter_inappwebview integration sample (SDK Quickstart). Ships as a
  plain WebView that compiles WITHOUT the AxSecurity SDK; uncomment the marked
  lines to route traffic through the SDK proxy.
publish_to: 'none'

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The WebView itself. This sample compiles and runs with ONLY this dependency.
  flutter_inappwebview: ^6.0.0

  cupertino_icons: ^1.0.2

  # *** UNCOMMENT FOR SDK *** — adds the AxSecurity Flutter plugin (which also
  # pulls flutter_inappwebview). It requires Android compileSdk 34 / iOS 12,
  # already configured in this project. Then uncomment the marked lines in
  # lib/main.dart.
  # axsecurity_flutter_plugin:
  #   path: ../plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
